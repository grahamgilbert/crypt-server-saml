name: Build and push image

on:
  # Triggered by grahamgilbert/Crypt-Server once the base image is pushed.
  repository_dispatch:
    types: [build]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of macadmins/crypt-server to build from, and to publish as"
        required: true
        default: latest

env:
  TAG: ${{ github.event.client_payload.tag || github.event.inputs.tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: BASE_TAG=${{ env.TAG }}
          tags: macadmins/crypt-server-saml:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
